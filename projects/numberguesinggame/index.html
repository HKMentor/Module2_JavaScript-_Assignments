<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game</title>
   <link rel="icon" type="image/png" href="./favicon.jpeg">


  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f6fa;
      color: #2f3640;
      transition: all 0.3s ease-in-out;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #0984e3;
    }

    input {
      padding: 10px;
      width: 80%;
      border: 2px solid #0984e3;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    button {
      background: #0984e3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
      transition: 0.3s;
    }

    button:hover {
      background: #74b9ff;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    /* Dark Mode */
    body.dark {
      background: #2f3640;
      color: #f5f6fa;
    }

    body.dark .container {
      background: #353b48;
      color: #f5f6fa;
    }

    body.dark input {
      border: 2px solid #74b9ff;
      background: #2f3640;
      color: white;
    }

    body.dark button {
      background: #74b9ff;
      color: black;
    }

    /* Toggle Switch */
    .toggle-container {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    .toggle-btn {
      background: #0984e3;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    body.dark .toggle-btn {
      background: #636e72;
    }
  </style>
</head>
<body>
  <!-- Toggle Button -->
  <div class="toggle-container">
    <button class="toggle-btn" onclick="toggleMode()">🌙 Dark</button>
  </div>

  <!-- Game Container -->
  <div class="container">
    <h1>🎲 Number Guessing Game</h1>
    <p>Guess a number between <b>1 and 10</b></p>
    <input type="number" id="userGuess" placeholder="Enter your guess">
    <br>
    <button onclick="checkGuess()">Guess</button>
    <button onclick="resetGame()">🔄 Reset</button>
    <p id="result"></p>
  </div>

  <script>
    let randomNumber = Math.floor(Math.random() * 10) + 1;
    let attempts = 3;

    function checkGuess() {
      const userGuess = document.getElementById("userGuess").value;
      const result = document.getElementById("result");

      if (attempts > 0) {
        if (userGuess == randomNumber) {
          result.textContent = "🎉 Correct! You guessed the number!";
          result.style.color = "green";
        } else {
          attempts--;
          if (attempts === 0) {
            result.textContent = `❌ Game Over! The number was ${randomNumber}`;
            result.style.color = "red";
          } else if (userGuess > randomNumber) {
            result.textContent = `⬇️ Too high! Attempts left: ${attempts}`;
            result.style.color = "orange";
          } else {
            result.textContent = `⬆️ Too low! Attempts left: ${attempts}`;
            result.style.color = "orange";
          }
        }
      }
    }

    function resetGame() {
      randomNumber = Math.floor(Math.random() * 10) + 1;
      attempts = 3;
      document.getElementById("userGuess").value = "";
      document.getElementById("result").textContent = "";
    }

    function toggleMode() {
      document.body.classList.toggle("dark");
      let btn = document.querySelector(".toggle-btn");
      if (document.body.classList.contains("dark")) {
        btn.textContent = "☀️ Light";
      } else {
        btn.textContent = "🌙 Dark";
      }
    }
  </script>
</body>
</html>
